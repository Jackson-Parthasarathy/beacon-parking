# Publishes app/ to GitHub Pages on every push. Every 3 hours it redeploys
# with fresh moving-truck permits, and on the 1st of each month it also
# re-pulls the City's sweeping schedule and commits the update.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"      # monthly schedule refresh
    - cron: "15 */3 * * *"   # permits

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh City schedule
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 1 * *'
        run: |
          pip install --quiet pandas shapely pyproj
          python tools/fetch_raw.py
          python tools/build_data.py
          node tools/test_planner.js
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/data/segments.json app/data/segments.js
          git diff --cached --quiet || (git commit -m "Refresh street sweeping data" && git push)

      - name: Moving-truck permits
        run: python3 tools/fetch_restrictions.py || echo "Permit data unavailable; deploying without it"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
